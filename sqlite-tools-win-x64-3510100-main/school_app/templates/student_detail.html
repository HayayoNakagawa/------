<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>学生詳細</title>
</head>
<body>
    <h1>学生詳細</h1>

    <p>学籍番号：{{ student[0] }}</p>
    <p>名前：{{ student[1] }}</p>

    <h2>成績</h2>
    <table border="1">
        <tr>
            <th>科目</th>
            <th>点数</th>
        </tr>
        {% for s in scores %}
        <tr>
            <td>{{ s[0] }}</td>
            <td>{{ s[1] }}</td>
        </tr>
        {% endfor %}
    </table>

    <!-- ★ここから追加 -->
    <h2>成績編集</h2>

    <form method="post" action="/students/{{ student[0] }}/edit">
        <table border="1">
            <tr>
                <th>科目</th>
                <th>点数</th>
            </tr>
            {% for s in scores %}
            <tr>
                <td>{{ s[0] }}</td>
                <td>
                    <input
                        type="number"
                        name="{{ s[0] }}"
                        value="{{ s[1] }}"
                        min="0"
                        max="100"
                    >
                </td>
            </tr>
            {% endfor %}
        </table>

        <button type="submit">保存</button>
    </form>
    <!-- ★ここまで -->

    <h3>成績を追加</h3>
    <form method="post" action="/students/{{ student[0] }}/add_score">
        <p>
            科目：
            <input type="text" name="subject" required>
        </p>
        <p>
            点数：
            <input type="number" name="score" required>
        </p>
        <button type="submit">追加</button>
    </form>

    <p><a href="/students">← 学生一覧に戻る</a></p>
</body>
</html>
