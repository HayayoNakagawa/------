<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>成績一覧</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            background: #fff;
            min-width: 600px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px 16px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #1976d2;
            color: white;
        }

        .search-box {
            max-width: 900px;
            margin: 0 auto 20px;
            text-align: center;
        }

        .search-box input {
            padding: 8px;
            width: 300px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .search-box button {
            padding: 8px 16px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #1565c0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

<h1>成績一覧</h1>

<p style="margin-bottom: 20px; text-align: center;">
  <a href="/" style="color: #2563eb; text-decoration: none;">← ホームへ戻る</a>
</p>

<div class="search-box">
  <form method="get">
    <input type="text" name="search" placeholder="名前または学籍番号で検索..." 
           value="{{ request.args.get('search', '') }}">
    <button type="submit">検索</button>
  </form>
</div>

<div class="container">
  <table>
    <tr>
        <th>学籍番号</th>
        <th>名前</th>
        <th>学科</th>
        <th>学年</th>
        <th>入学年度</th>
        {% for subj in subjects %}
        <th>{{ subj }}</th>
        {% endfor %}
    </tr>

    {% for s in scores %}
    <tr>
        <td>{{ s[0] }}</td>
        <td>
          <a href="/students/{{ s[0] }}?from=scores" style="color: #2563eb; text-decoration: none;">
            {{ s[1] }}
          </a>
        </td>
        <td>{{ s[2] }}</td>
        <td>{{ s[3] }}</td>
        <td>{{ s[4] }}</td>
        {% for i in range(subjects|length) %}
        <td>{{ s[5 + i] if s[5 + i] is not none else "-" }}</td>
        {% endfor %}
    </tr>
    {% endfor %}

</table>
</div>

</body>
</html>
