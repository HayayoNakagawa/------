<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>成績一覧</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            background: #fff;
            min-width: 600px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px 16px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #1976d2;
            color: white;
        }
    </style>
</head>
<body>

<h1>成績一覧</h1>

<p style="margin-bottom: 20px;">
  <a href="/" style="color: #2563eb; text-decoration: none;">← ホームへ戻る</a>
</p>

<table>
    <tr>
        <th>学籍番号</th>
        <th>名前</th>
        {% for subj in subjects %}
        <th>{{ subj }}</th>
        {% endfor %}
    </tr>

    {% for s in scores %}
    <tr>
        <td>{{ s[0] }}</td>
        <td>{{ s[1] }}</td>
        {% for i in range(subjects|length) %}
        <td>{{ s[3 + i] if s[3 + i] is not none else "-" }}</td>
        {% endfor %}
    </tr>
    {% endfor %}

</table>

</body>
</html>
