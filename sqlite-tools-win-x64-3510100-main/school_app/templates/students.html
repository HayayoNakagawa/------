<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>学生一覧</title>
</head>
<body>
    <h1>学生一覧</h1>

    <table border="1">
        <tr>
            <th>学籍番号</th>
            <th>名前</th>
        </tr>

        {% for s in students %}
        <tr>
            <td>{{ s[0] }}</td>
            <td>
                <a href="/students/{{ s[0] }}">
                    {{ s[1] }}
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
