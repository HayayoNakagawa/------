<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>学生追加</title>
</head>
<body>
    <h1>学生追加</h1>

    <p style="margin-bottom: 20px;">
      <a href="/" style="color: #2563eb; text-decoration: none;">← ホームへ戻る</a>
    </p>

    <form method="post">
    <p>
        学籍番号：
        <input type="text" name="student_id" required>
    </p>

    <p>
        名前：
        <input type="text" name="name" required>
    </p>

    <p>
        学科：
        <input type="text" name="department" required>
    </p>

    <p>
        学年：
        <input type="number" name="grade" required>
    </p>

    <p>
        年度：
        <input type="number" name="year" required>
    </p>

</form>

    <p><a href="/students">← 学生一覧へ</a></p>
    <p style="text-align: center;"><a href="/">← ホームへ戻る</a></p>
</body>
</html>
